name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Studio Binaries
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and integrity tests
        run: npm test

      - name: Build Electron executables (NSIS Setup & Portable)
        run: npx electron-builder --win --publish never

      - name: Upload Studio build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: fnirsi-ips3608-studio-windows
          path: |
            dist/*.exe
          retention-days: 14

  build-firmware:
    name: Build AT32F415 Open Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Compile firmware (Stage 1 Safe Bring-Up)
        run: make -C firmware

      - name: Verify firmware binary size, vector table & calibration bounds
        run: node firmware/scripts/verify_bin.js firmware/build/IPS3608_OpenFW.bin

      - name: Upload firmware build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ips3608-open-firmware
          path: |
            firmware/build/IPS3608_OpenFW.bin
            firmware/build/IPS3608_OpenFW.hex
            firmware/build/IPS3608_OpenFW.elf
            firmware/build/IPS3608_OpenFW.map
          retention-days: 14

  release:
    name: Publish Combined GitHub Release
    runs-on: ubuntu-latest
    needs: [ build, build-firmware ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Publish Release (Studio + Firmware)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.bin
            release-assets/*.hex
            release-assets/*.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
